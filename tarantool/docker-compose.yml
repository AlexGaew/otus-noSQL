version: "3.9"

services:
  tarantool:
    image: tarantool/tarantool:2.11
    container_name: tarantool-otus
    restart: unless-stopped
    ports:
      - "3301:3301"
    environment:
      TARANTOOL_USER_NAME: admin
      TARANTOOL_USER_PASSWORD: password
    volumes:
      - tarantool_data:/var/lib/tarantool

volumes:
  tarantool_data: